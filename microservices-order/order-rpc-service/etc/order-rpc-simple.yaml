Name: order-rpc
ListenOn: 0.0.0.0:9002
Mode: dev
Timeout: 0  # 关闭服务端超时拦截器，避免 2s 默认超时

# MySQL 数据库配置
MySQL:
  Host: 127.0.0.1 # 连接到 Docker 暴露的端口（订单服务对应 3308）
  Port: 3308
  User: root
  Password: "123456"
  Database: mysql_demo
  Charset: utf8mb4

# Redis 配置
RedisConf:
  Host: 127.0.0.1 # 连接到 Docker 暴露的端口（订单服务对应 6381）
  Port: 6381
  Password: ""
  DB: 0
  PoolSize: 10

# RocketMQ 配置（简化，暂时不启用）
RocketMQ:
  NameServer: ""
  GroupName: "order_srv_1"
  Topic:
    CreateOrder: "xx_create_order"
    PayTimeout: "xx_pay_timeout"
    StockRollback: "xx_stock_rollback"
    CreateOrderSuccessfully: "xx_create_order_successfully"

# Snowflake ID 生成器配置
Snowflake:
  StartTime: "2023-01-01"
  MachineID: 1

# 外部服务配置
GoodsService:
  Name: "goods_srv"
  Endpoints:
    - "127.0.0.1:9001"  # 商品服务端点
  Timeout: 0

StockService:
  Name: "stock_srv"
  Endpoints:
    - "127.0.0.1:9003"  # 库存服务端点
  Timeout: 0

# Consul 配置
Consul:
  Addr: "consul:8500"