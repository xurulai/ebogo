Name: order-rpc
ListenOn: 0.0.0.0:9002
Mode: dev

# MySQL 数据库配置
MySQL:
  Host: 127.0.0.1
  Port: 3306
  User: root
  Password: "123456"
  Database: mysql_demo
  Charset: utf8mb4

# Redis 配置
RedisConf:
  Host: 127.0.0.1
  Port: 6379
  Password: ""
  DB: 0
  PoolSize: 10

# RocketMQ 配置
RocketMQ:
  NameServer: "127.0.0.1:9876"
  GroupName: "order_srv_1"
  Topic:
    CreateOrder: "xx_create_order"
    PayTimeout: "xx_pay_timeout"
    StockRollback: "xx_stock_rollback"
    CreateOrderSuccessfully: "xx_create_order_successfully"

# Snowflake ID 生成器配置
Snowflake:
  StartTime: "2023-01-01"
  MachineID: 1

# 外部服务配置
GoodsService:
  Name: "goods_srv"
  Endpoints:
    - "127.0.0.1:9001"
  Timeout: 5000

StockService:
  Name: "stock_srv"
  Endpoints:
    - "127.0.0.1:9003"
  Timeout: 5000

# Consul 配置
Consul:
  Addr: "127.0.0.1:8500"
