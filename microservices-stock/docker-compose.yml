version: '3.8'

services:
  # MySQL 数据库服务
  # 统一使用 order-mysql，这里移除独立 mysql 服务

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: microservice-stock-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 库存核心服务（内部服务，不对外暴露）
  stock-service:
    build:
      context: .
      dockerfile: ./stock-rpc-service/Dockerfile
    container_name: stock-service
    restart: unless-stopped
    expose:
      - "8889"  # 只在内部网络暴露
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DB=mysql_demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./stock-rpc-service/etc/stock-rpc-docker.yaml:/root/etc/stock-rpc.yaml
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8889"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API 网关（统一对外入口）
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: stock-api-gateway
    restart: unless-stopped
    ports:
      - "8081:8080"  # 对外暴露的唯一端口
    environment:
      - STOCK_SERVICE_ENDPOINT=stock-service:8889
    volumes:
      - ./api-gateway/etc/gateway-api-docker.yaml:/root/etc/gateway-api.yaml
    depends_on:
      stock-service:
        condition: service_healthy
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/stock/get?goods_id=1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  microservice-network:
    external: true

volumes:
  redis_data:
    driver: local

